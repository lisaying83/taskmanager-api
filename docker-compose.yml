services:
  api:
    build:
      context: .
      dockerfile: src/TaskManager.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=taskmanager;Username=postgres;Password=postgres
      - Jwt__Secret=CHANGE_THIS_IN_PRODUCTION_minimum_32_chars_secret_key!!
      - Jwt__Issuer=taskmanager-api
      - Jwt__Audience=taskmanager-client
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
